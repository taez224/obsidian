name: Deploy Obsidian Garden

on:
  push:
    branches:
      - main
    paths:
      - '01_Slipbox/**'
      - '20_Projects/blog/**'
      - '20_Projects/obsidian-garden/**'
      - '30_Resources/Development/Concepts/**'
      - '30_Resources/Development/Troubleshooting/**'
      - '30_Resources/Development/Tools/**'
      - '30_Resources/References/Books/**'
      - '.github/workflows/obsidian-garden-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 20_Projects/obsidian-garden/package-lock.json

      - name: Install build dependencies
        working-directory: 20_Projects/obsidian-garden
        run: npm ci

      - name: Restore OG font cache
        uses: actions/cache@v4
        with:
          path: 20_Projects/obsidian-garden/node_modules/.cache/garden-og-fonts
          key: garden-og-fonts-${{ hashFiles('20_Projects/obsidian-garden/src/lib/og-fonts.mjs') }}

      # 카드 파일은 최종 SVG·폰트·resvg 버전의 해시로 스스로 유효성을 갖는다. 실행마다 저장하고 가장 최근 것을 복원한다.
      - name: Restore OG card cache
        uses: actions/cache@v4
        with:
          path: 20_Projects/obsidian-garden/node_modules/.cache/garden-og-images
          key: garden-og-images-${{ github.run_id }}
          restore-keys: |
            garden-og-images-

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Test public garden
        working-directory: 20_Projects/obsidian-garden
        run: npm test

      - name: Build public garden
        working-directory: 20_Projects/obsidian-garden
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 20_Projects/obsidian-garden/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
