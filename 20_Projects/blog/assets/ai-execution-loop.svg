<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"

     font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace">
  <title>The AI execution loop and the harness that feeds it</title>
  <desc>Conventions, context and review procedures feed an AI execution loop of spec, implement, verify and ship. Local fixes return from verification to implementation. Success signals accumulate against the criteria already chosen.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#2C4F7C" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#77869A" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#B4472F" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-harness" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#8AA0B8" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="corner-tick">
      <path d="M0,0 h14 M0,0 v14" stroke="#2C4F7C" stroke-width="1.6" fill="none"/>
    </g>
  </defs>

  <rect width="820" height="420" fill="#F6F4EF"/>

  <!-- Editorial blueprint frame. -->
  <use href="#corner-tick" x="20" y="20"/>
  <g transform="translate(800,20) scale(-1,1)"><use href="#corner-tick"/></g>
  <g transform="translate(20,400) scale(1,-1)"><use href="#corner-tick"/></g>
  <g transform="translate(800,400) scale(-1,-1)"><use href="#corner-tick"/></g>

  <rect x="464" y="24" width="300" height="38" fill="none" stroke="#2C4F7C" stroke-width="1.6"/>
  <line x1="464" y1="43" x2="764" y2="43" stroke="#2C4F7C" stroke-width="1.6"/>
  <text x="474" y="38" font-size="11.5" fill="#2C4F7C" letter-spacing="0.35">FIG. 1 · AI EXECUTION LOOP</text>
  <text x="474" y="57" font-size="12" fill="#647184" letter-spacing="0.25">QRA · ONCE THE APPROACH IS CHOSEN</text>

  <g transform="translate(0,54)">

  <!-- AI follows and improves the path already chosen. -->
  <rect x="58" y="46" width="704" height="272" rx="10" fill="none" stroke="#2C4F7C" stroke-width="2.2"/>
  <text x="82" y="78" font-size="22" font-weight="700" fill="#2C4F7C" letter-spacing="1.8">AI EXECUTION</text>
  <text x="82" y="101" font-size="18" fill="#3C5470">Does this implementation meet the current criteria?</text>

  <!-- The loop was not naive: conventions, context and review procedures fed every stage. -->
  <rect x="90" y="118" width="640" height="34" rx="6" fill="#F6F4EF" stroke="#8AA0B8" stroke-width="1.6"/>
  <text x="410" y="140" font-size="14.5" font-weight="700" fill="#52708F" text-anchor="middle" letter-spacing="0.9">CONVENTIONS · CONTEXT · REVIEW PROCEDURES</text>
  <g fill="none" stroke="#8AA0B8" stroke-width="1.8" stroke-linecap="round">
    <line x1="140" y1="152" x2="140" y2="162" marker-end="url(#arrow-harness)"/>
    <line x1="320" y1="152" x2="320" y2="162" marker-end="url(#arrow-harness)"/>
    <line x1="500" y1="152" x2="500" y2="162" marker-end="url(#arrow-harness)"/>
    <line x1="680" y1="152" x2="680" y2="162" marker-end="url(#arrow-harness)"/>
  </g>

  <!-- The main path reaches a shipped result; local fixes cycle between implementation and verification without reopening the spec. -->
  <g fill="#F6F4EF" stroke="#2C4F7C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="168" width="100" height="70" rx="7"/>
    <rect x="270" y="168" width="100" height="70" rx="7"/>
    <rect x="450" y="168" width="100" height="70" rx="7"/>
    <rect x="630" y="168" width="100" height="70" rx="7"/>
  </g>
  <g fill="none" stroke="#2C4F7C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M122 186 h36 M122 197 h36 M122 208 h24"/>
    <path d="M306 184 l-9 12 l9 12 M334 184 l9 12 l-9 12"/>
    <path d="M482 196 l9 11 l18 -23"/>
    <path d="M680 209 v-27 M680 182 l-10 10 M680 182 l10 10"/>
  </g>
  <g fill="none" stroke="#2C4F7C" stroke-width="2.2" stroke-linecap="round">
    <line x1="198" y1="203" x2="266" y2="203" marker-end="url(#arrow-blue)"/>
    <line x1="378" y1="203" x2="446" y2="203" marker-end="url(#arrow-blue)"/>
    <line x1="558" y1="203" x2="626" y2="203" marker-end="url(#arrow-blue)"/>
  </g>
  <g font-size="13.5" font-weight="700" fill="#2C4F7C" text-anchor="middle" letter-spacing="1">
    <text x="140" y="230">SPEC</text>
    <text x="320" y="230">IMPLEMENT</text>
    <text x="500" y="230">VERIFY</text>
    <text x="680" y="230">SHIP</text>
  </g>

  <path d="M500 244 C500 264 370 264 320 242"
        fill="none" stroke="#2C4F7C" stroke-width="2.2" stroke-linecap="round"
        marker-end="url(#arrow-blue)"/>
  <!-- The loop stays above its label so both feedback and wording remain legible. -->
  <text x="410" y="280" font-size="19" fill="#2C4F7C" text-anchor="middle">Success signals accumulated</text>

  </g>
  <text x="764" y="397" font-size="11.5" fill="#647184" text-anchor="end" letter-spacing="0.35">CONCEPT BY TAEZ · DEVELOPED WITH CLAUDE + GPT</text>
</svg>
