<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="t d">
<title id="t">세 가지 데이터 분리 방식의 배치</title>
<desc id="d">행 분리는 한 DB의 한 테이블에 테넌트 A와 테넌트 B의 행을 함께 저장하고, 각 행의 tenant_id 열 값으로 테넌트를 구분한다. 스키마 분리는 한 DB 안에 스키마 A와 스키마 B를 두고 각 스키마에 테이블을 둔다. DB 분리는 DB A와 DB B를 따로 두고 각 DB에 테이블을 둔다.</desc>
<rect width="720" height="370" fill="#fff"/>
<text x="120" y="32" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#1f2d3a" text-anchor="middle">행 분리</text>
<text x="120" y="56" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" fill="#5a6877" text-anchor="middle">한 테이블에 함께 저장</text>
<text x="360" y="32" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#1f2d3a" text-anchor="middle">스키마 분리</text>
<text x="360" y="56" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" fill="#5a6877" text-anchor="middle">한 DB 안에서 스키마를 나눔</text>
<text x="600" y="32" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#1f2d3a" text-anchor="middle">DB 분리</text>
<text x="600" y="56" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" fill="#5a6877" text-anchor="middle">테넌트마다 DB를 나눔</text>
