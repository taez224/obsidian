<rect x="50" y="254" width="140" height="20" rx="3" fill="#e6f4ec" stroke="#2e7d55" stroke-width="1.5"/>
<text x="64" y="269" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5a6877" text-anchor="middle">4</text>
<line x1="80" y1="258" x2="80" y2="270" stroke="#2e7d55" stroke-width="1"/>
<text x="118" y="269" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2e7d55" text-anchor="middle">B</text>
<line x1="156" y1="258" x2="156" y2="270" stroke="#2e7d55" stroke-width="1"/>
<text x="172" y="269" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5a6877" text-anchor="middle">…</text>
