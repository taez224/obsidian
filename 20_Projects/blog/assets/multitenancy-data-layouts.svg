<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="t d">
<title id="t">세 가지 데이터 분리 방식의 배치</title>
<desc id="d">행 단위 분리는 DB 하나 안 casting 테이블의 행을 tenant_id로 나눈다. 스키마 분리는 shared DB 하나 안의 marvel_schema와 dc_schema에 casting 테이블을 둔다. DB 분리는 marvel_db와 dc_db 두 DB에 casting 테이블을 둔다.</desc>
